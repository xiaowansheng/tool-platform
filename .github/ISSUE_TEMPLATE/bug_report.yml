name: Bug report
description: Report a reproducible problem in Tool Platform
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail for maintainers to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide exact steps, input samples, and the tool/page involved.
      placeholder: |
        1. Go to ...
        2. Paste ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 126, Firefox 127, Safari 17
  - type: input
    id: node
    attributes:
      label: Node.js and pnpm version
      placeholder: Node 20.x, pnpm 10.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
