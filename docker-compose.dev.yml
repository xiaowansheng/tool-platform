services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: >
      sh -c 'pnpm install --frozen-lockfile &&
      pnpm generate:tools &&
      pnpm --filter @tool-platform/web dev -- --hostname 0.0.0.0 --port 3000'
    environment:
      CHOKIDAR_USEPOLLING: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "${TOOL_PLATFORM_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm/store

volumes:
  node_modules:
  pnpm-store:
